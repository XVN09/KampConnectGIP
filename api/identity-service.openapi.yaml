openapi: 3.0.0
info:
  title: KampConnect — Identity Service
  version: 1.0.0
  description: |
    Authorization server van KampConnect volgens **OAuth 2.1** en **OpenID Connect**.

    * Gebruikers loggen in via de **authorization code flow met PKCE (S256)**.
    * Access tokens zijn JWT's (RS256, 15 min) met `sub`, `tenant_id`, `roles` en `scope`.
      Een beheerder van KampConnect krijgt geen `tenant_id` maar de claim `is_platform_admin`.
      Andere services valideren ze lokaal met de publieke sleutel uit `/.well-known/jwks.json`.
    * Refresh tokens roteren bij elk gebruik en worden gehasht bewaard.
    * Niet ondersteund (OAuth 2.1): implicit flow en password grant.

servers:
  - url: https://auth.kampconnect.be
    description: Productie
  - url: https://localhost:5001
    description: Lokaal

tags:
  - name: Discovery
    description: Metadata en publieke sleutels
  - name: OAuth
    description: Inloggen en tokens
  - name: Account
    description: Registratie en wachtwoordbeheer

paths:
  /.well-known/openid-configuration:
    get:
      tags: [Discovery]
      summary: Configuratie van de authorization server
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Configuration' }

  /.well-known/jwks.json:
    get:
      tags: [Discovery]
      summary: Publieke sleutels om tokens te valideren
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }

  /oauth2/authorize:
    get:
      tags: [OAuth]
      summary: Login-flow starten
      description: |
        Stuurt de gebruiker naar de loginpagina. Na het inloggen volgt een redirect naar
        `redirect_uri` met een eenmalige `code` (60 seconden geldig) en de `state`.
      security: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string, example: kampconnect-app } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, example: 'be.kampconnect.app:/callback' } }
        - { name: scope, in: query, required: true, schema: { type: string, example: openid offline_access } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
      responses:
        '302':
          description: Redirect naar de loginpagina of terug naar de app met `code` en `state`
        '400':
          description: Onbekende client of ongeldige `redirect_uri`

  /oauth2/login:
    post:
      tags: [OAuth]
      summary: Inloggen met e-mail en wachtwoord
      description: Wordt verstuurd vanuit de loginpagina. Na 5 mislukte pogingen wordt het account tijdelijk vergrendeld.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '302':
          description: Ingelogd, redirect terug naar `/oauth2/authorize`
        '401':
          description: Onjuiste gegevens
        '423':
          description: Account tijdelijk vergrendeld

  /oauth2/token:
    post:
      tags: [OAuth]
      summary: Tokens ophalen of vernieuwen
      description: |
        * `authorization_code` — code inwisselen, met `code_verifier` (PKCE)
        * `refresh_token` — nieuw access token; je krijgt ook een nieuw refresh token
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
            examples:
              authorization_code:
                value:
                  grant_type: authorization_code
                  client_id: kampconnect-app
                  code: SplxlOBeZQQYbYS6WxSbIA
                  redirect_uri: 'be.kampconnect.app:/callback'
                  code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
              refresh_token:
                value:
                  grant_type: refresh_token
                  client_id: kampconnect-app
                  refresh_token: 8xLOxBtZp8
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: Ongeldige aanvraag (bv. verlopen code of PKCE-fout)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }

  /oauth2/revoke:
    post:
      tags: [OAuth]
      summary: Refresh- of access token intrekken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, client_id]
              properties:
                token: { type: string }
                client_id: { type: string }
      responses:
        '200':
          description: Ingetrokken (ook als het token al ongeldig was)

  /oauth2/end-session:
    get:
      tags: [OAuth]
      summary: OIDC-browsersessie beëindigen
      description: |
        Beëindigt de login-cookie van de gebruiker bij Identity. OpenIddict valideert
        `id_token_hint` en de eventuele `post_logout_redirect_uri` tegen de clientregistratie.
        Dit endpoint trekt niet automatisch refresh- of access tokens in; gebruik daarvoor
        `/oauth2/revoke`.
      security: []
      parameters:
        - { name: client_id, in: query, required: false, schema: { type: string } }
        - { name: id_token_hint, in: query, required: false, schema: { type: string } }
        - { name: post_logout_redirect_uri, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
      responses:
        '302':
          description: Logout afgehandeld; redirect wanneer een geldige terugkeer-URI is opgegeven
        '400':
          description: Ongeldige logoutaanvraag of niet-geregistreerde terugkeer-URI

  /oauth2/userinfo:
    get:
      tags: [OAuth]
      summary: Gegevens van de ingelogde gebruiker
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserInfo' }
        '401':
          description: Geen of ongeldig token

  /api/account/register:
    post:
      tags: [Account]
      summary: Account aanmaken
      description: |
        Maakt enkel de login aan. Het profiel (naam, …) wordt door de User Service aangemaakt.
        De rol en organisatie volgen uit de uitnodigingslink (`invitationToken`).
        Er wordt een verificatiemail verstuurd.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account aangemaakt
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: integer, format: int32 }
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: E-mailadres al in gebruik

  /api/account/verify-email:
    post:
      tags: [Account]
      summary: E-mailadres bevestigen
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: Token uit de verificatiemail }
      responses:
        '204':
          description: Bevestigd
        '400':
          description: Token ongeldig of verlopen

  /api/account/forgot-password:
    post:
      tags: [Account]
      summary: Wachtwoordherstel aanvragen
      description: Geeft altijd `204`, ook als het e-mailadres niet bestaat.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204':
          description: Mail verstuurd (als het account bestaat)

  /api/account/reset-password:
    post:
      tags: [Account]
      summary: Nieuw wachtwoord instellen
      description: Trekt alle bestaande sessies van de gebruiker in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password, minLength: 12 }
      responses:
        '204':
          description: Wachtwoord gewijzigd
        '400':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Validatiefout
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    Configuration:
      type: object
      properties:
        issuer: { type: string, example: 'https://auth.kampconnect.be' }
        authorization_endpoint: { type: string, example: 'https://auth.kampconnect.be/oauth2/authorize' }
        token_endpoint: { type: string, example: 'https://auth.kampconnect.be/oauth2/token' }
        end_session_endpoint: { type: string, example: 'https://auth.kampconnect.be/oauth2/end-session' }
        revocation_endpoint: { type: string, example: 'https://auth.kampconnect.be/oauth2/revoke' }
        userinfo_endpoint: { type: string, example: 'https://auth.kampconnect.be/oauth2/userinfo' }
        jwks_uri: { type: string, example: 'https://auth.kampconnect.be/.well-known/jwks.json' }
        grant_types_supported:
          type: array
          items: { type: string }
          example: [authorization_code, refresh_token]
        code_challenge_methods_supported:
          type: array
          items: { type: string }
          example: [S256]

    Jwks:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty: { type: string, example: RSA }
              kid: { type: string, example: key-2026-09 }
              alg: { type: string, example: RS256 }
              n: { type: string }
              e: { type: string, example: AQAB }

    LoginRequest:
      type: object
      required: [email, password, returnUrl]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        returnUrl: { type: string }

    TokenRequest:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        client_id: { type: string }
        code: { type: string, description: Enkel bij `authorization_code` }
        redirect_uri: { type: string, description: Enkel bij `authorization_code` }
        code_verifier: { type: string, description: Enkel bij `authorization_code` (PKCE) }
        refresh_token: { type: string, description: Enkel bij `refresh_token` }

    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }
        refresh_token: { type: string }
        id_token: { type: string }

    UserInfo:
      type: object
      properties:
        sub: { type: string, example: '58', description: '`user_id` uit `sec_user`' }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        tenant_id: { type: integer, format: int32, description: Ontbreekt bij een platformbeheerder }
        roles:
          type: array
          items: { type: string, enum: [organisation_admin, staff, guardian] }
        is_platform_admin: { type: boolean, description: Enkel aanwezig voor beheerders van KampConnect }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 12 }
        invitationToken: { type: string, description: Uit de uitnodigingslink }

    OAuthError:
      type: object
      properties:
        error: { type: string, example: invalid_grant }
        error_description: { type: string }

    ProblemDetails:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
