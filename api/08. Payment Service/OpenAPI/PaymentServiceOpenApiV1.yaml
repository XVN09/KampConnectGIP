openapi: 3.0.0
info:
  title: KampConnect — Payment Service
  version: 1.0.0
  description: "Int het geld voor openstaande facturen via een externe betaalprovider (bv. Mollie). KampConnect\
    \ raakt nooit\nkaartgegevens aan: de betaler wordt doorgestuurd naar de pagina van de provider.\n**De webhook\
    \ is de waarheid**, niet de terugkeerpagina. Database: `pay_*`.\n\n**Algemene afspraken**\n* Alle requests lopen\
    \ via de API Gateway en dragen een `Authorization: Bearer <access token>`.\n* De organisatie volgt uit de claim\
    \ `tenant_id` in het token; ze staat daarom niet in de URL.\n  Een token zonder `tenant_id` krijgt geen toegang\
    \ tot organisatiegegevens, tenzij `is_platform_admin` aanwezig is.\n* Tijdstippen zijn UTC in ISO 8601. Fouten\
    \ volgen RFC 7807 (Problem Details).\n"
servers:
- url: https://api.kampconnect.be
  description: Productie (via de API Gateway)
- url: https://localhost:5000
  description: Lokaal (gateway)
security:
- bearerAuth: []
tags:
- name: Betalingen
  description: Betalingen starten en opvolgen
- name: Webhooks
  description: Berichten van de betaalprovider
paths:
  /api/payments:
    get:
      tags:
      - Betalingen
      summary: Betalingen opvragen
      description: '**Rollen:** `organisation_admin`'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Betalingen
      summary: Betaling starten voor een factuur
      description: 'Stuur de gebruiker daarna naar `checkoutUrl`.


        **Rollen:** `organisation_admin`'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
        description: Uniek per poging; voorkomt dubbele betalingen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - invoiceId
              properties:
                invoiceId:
                  type: string
                  format: uuid
                returnUrl:
                  type: string
                  format: uri
      responses:
        '201':
          description: Aangemaakt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/payments/{paymentId}:
    get:
      tags:
      - Betalingen
      summary: Betaling opvragen
      description: '**Rollen:** `organisation_admin`'
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/payments/{paymentId}/refunds:
    post:
      tags:
      - Betalingen
      summary: Terugbetaling starten
      description: '**Rollen:** `platform_admin`'
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amountCents
              - reason
              properties:
                amountCents:
                  type: integer
                  format: int64
                reason:
                  type: string
      responses:
        '201':
          description: Aangevraagd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/webhooks/{providerCode}:
    post:
      tags:
      - Webhooks
      summary: Webhook van de betaalprovider
      description: De handtekening wordt gecontroleerd en elk bericht wordt maar één keer verwerkt. Bij een geslaagde
        betaling volgt `payment.PaymentSucceeded.v1`.
      security: []
      parameters:
      - name: providerCode
        in: path
        required: true
        schema:
          type: string
          example: mollie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Formaat van de provider
      responses:
        '200':
          description: Ontvangen
        '400':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token van de Identity Service. De gateway valideert het token, de service controleert
        tenant en rol.
  responses:
    ValidationError:
      description: Validatiefout
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Geen of ongeldig access token
    Forbidden:
      description: Geen toegang (verkeerde rol of andere organisatie)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Niet gevonden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict met de huidige toestand
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      description: Foutformaat volgens RFC 7807 (standaard in ASP.NET Core)
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Page:
      type: object
      required:
      - page
      - pageSize
      - totalCount
      properties:
        page:
          type: integer
          format: int32
          example: 1
        pageSize:
          type: integer
          format: int32
          example: 25
        totalCount:
          type: integer
          format: int32
          example: 3
    PaymentStatus:
      type: string
      enum:
      - pending
      - authorized
      - succeeded
      - failed
      - expired
      - refunded
      - charged_back
    Payment:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amountCents:
          type: integer
          format: int64
          example: 5929
        currency:
          type: string
          example: EUR
        paymentMethod:
          type: string
          example: bancontact
        checkoutUrl:
          type: string
          format: uri
          description: Enkel zolang de betaling `pending` is
        createdAt:
          type: string
          format: date-time
        succeededAt:
          type: string
          format: date-time
        failureMessage:
          type: string
    Refund:
      type: object
      properties:
        refundId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - succeeded
          - failed
        amountCents:
          type: integer
          format: int64
        reason:
          type: string
        requestedAt:
          type: string
          format: date-time
