openapi: 3.0.0
info:
  title: KampConnect — Notification Service
  version: 1.0.0
  description: "Bereikt gebruikers buiten de app (push en e-mail). De meldingen zelf ontstaan **uitsluitend uit\
    \ events**; deze kleine\nREST-API dient enkel om toesteltokens te registreren en voorkeuren in te stellen. Database:\
    \ `ntf_*`.\n\n**Algemene afspraken**\n* Alle requests lopen via de API Gateway en dragen een `Authorization:\
    \ Bearer <access token>`.\n* De organisatie volgt uit de claim `tenant_id` in het token; ze staat daarom niet\
    \ in de URL.\n  Een token zonder `tenant_id` krijgt geen toegang tot organisatiegegevens, tenzij `is_platform_admin`\
    \ aanwezig is.\n* Tijdstippen zijn UTC in ISO 8601. Fouten volgen RFC 7807 (Problem Details).\n"
servers:
- url: https://api.kampconnect.be
  description: Productie (via de API Gateway)
- url: https://localhost:5000
  description: Lokaal (gateway)
security:
- bearerAuth: []
tags:
- name: Toestellen
  description: Pushtokens van de mobiele app
- name: Voorkeuren
  description: Welke meldingen, via welk kanaal, en stille uren
- name: Meldingen
  description: Overzicht van ontvangen meldingen
paths:
  /api/notifications/device-tokens:
    post:
      tags:
      - Toestellen
      summary: Toestel registreren
      description: 'Aanroepen na het inloggen en telkens FCM/APNs een nieuw token geeft.


        **Rollen:** `guardian`, `staff`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenCreate'
      responses:
        '201':
          description: Geregistreerd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceToken'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/notifications/device-tokens/{deviceTokenId}:
    delete:
      tags:
      - Toestellen
      summary: Toestel afmelden (bij uitloggen)
      description: '**Rollen:** `guardian`, `staff`'
      parameters:
      - name: deviceTokenId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Afgemeld
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/notifications/preferences:
    get:
      tags:
      - Voorkeuren
      summary: Mijn meldingsvoorkeuren
      description: '**Rollen:** `guardian`, `staff`'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preference'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
      - Voorkeuren
      summary: Voorkeuren opslaan
      description: 'Verplichte meldingen (bv. noodoproepen) kunnen niet uitgezet worden.


        **Rollen:** `guardian`, `staff`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Preference'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preference'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/notifications/quiet-hours:
    get:
      tags:
      - Voorkeuren
      summary: Stille uren opvragen
      description: '**Rollen:** `guardian`, `staff`'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuietHours'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
      - Voorkeuren
      summary: Stille uren instellen
      description: '**Rollen:** `guardian`, `staff`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuietHours'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuietHours'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/notifications:
    get:
      tags:
      - Meldingen
      summary: Mijn meldingen
      description: '**Rollen:** `guardian`, `staff`'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token van de Identity Service. De gateway valideert het token, de service controleert
        tenant en rol.
  responses:
    ValidationError:
      description: Validatiefout
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Geen of ongeldig access token
    Forbidden:
      description: Geen toegang (verkeerde rol of andere organisatie)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Niet gevonden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict met de huidige toestand
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      description: Foutformaat volgens RFC 7807 (standaard in ASP.NET Core)
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Page:
      type: object
      required:
      - page
      - pageSize
      - totalCount
      properties:
        page:
          type: integer
          format: int32
          example: 1
        pageSize:
          type: integer
          format: int32
          example: 25
        totalCount:
          type: integer
          format: int32
          example: 3
    DeviceTokenCreate:
      type: object
      required:
      - platform
      - token
      properties:
        platform:
          type: string
          enum:
          - android
          - ios
          - web
        token:
          type: string
        appVersion:
          type: string
          example: 1.0.3
        language:
          type: string
          example: nl
    DeviceToken:
      type: object
      properties:
        deviceTokenId:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - android
          - ios
          - web
        registeredAt:
          type: string
          format: date-time
    Preference:
      type: object
      required:
      - notificationTypeCode
      - channel
      - isEnabled
      properties:
        notificationTypeCode:
          type: string
          example: message_received
        channel:
          type: string
          enum:
          - push
          - email
        isEnabled:
          type: boolean
        isMandatory:
          type: boolean
          readOnly: true
    QuietHours:
      type: object
      required:
      - isEnabled
      properties:
        isEnabled:
          type: boolean
        startTime:
          type: string
          example: '22:00'
        endTime:
          type: string
          example: 07:00
        timezone:
          type: string
          example: Europe/Brussels
    Notification:
      type: object
      properties:
        notificationId:
          type: string
          format: uuid
        notificationTypeCode:
          type: string
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
