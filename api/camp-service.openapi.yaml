openapi: 3.0.0
info:
  title: KampConnect — Camp Service
  version: 1.0.0
  description: "Het kamp als organisatorische eenheid: kampen, groepen, deelnemers en leiding. Camp bepaalt **wie\
    \ met wie**\nmag communiceren; Messaging en Calling bouwen hun rechten op uit de `camp.*`-events. Geen inschrijvingen\
    \ of betalingen.\nDatabase: `cmp_*`.\n\nLevenscyclus: `planned` → `active` → `ended` → `archived` (los daarvan:\
    \ gepubliceerd ja/nee).\n\n**Algemene afspraken**\n* Alle requests lopen via de API Gateway en dragen een `Authorization:\
    \ Bearer <access token>`.\n* De organisatie volgt uit de claim `tenant_id` in het token; ze staat daarom niet\
    \ in de URL.\n  Een token zonder `tenant_id` krijgt geen toegang tot organisatiegegevens, tenzij `is_platform_admin`\
    \ aanwezig is.\n* Tijdstippen zijn UTC in ISO 8601. Fouten volgen RFC 7807 (Problem Details).\n"
servers:
- url: https://api.kampconnect.be
  description: Productie (via de API Gateway)
- url: https://localhost:5000
  description: Lokaal (gateway)
security:
- bearerAuth: []
tags:
- name: Kampen
  description: Kampen en hun status
- name: Groepen
  description: Groepsindeling binnen een kamp
- name: Deelnemers & leiding
  description: Kinderen en leiding toewijzen
- name: Activiteiten
  description: Programma van een kamp
paths:
  /api/camps:
    get:
      tags:
      - Kampen
      summary: Kampen opvragen
      description: 'Een ouder ziet enkel kampen waar een van zijn kinderen aan deelneemt.


        **Rollen:** `guardian`, `staff`'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CampStatus'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Camp'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Kampen
      summary: Kamp aanmaken
      description: 'Controleert synchroon bij Tenant of de formule nog een kamp toelaat. Publiceert `camp.CampCreated.v1`.


        **Rollen:** `organisation_admin`, `staff`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampInput'
      responses:
        '201':
          description: Aangemaakt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camp'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/camps/{campId}:
    get:
      tags:
      - Kampen
      summary: Kamp opvragen
      description: '**Rollen:** `guardian`, `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camp'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
      - Kampen
      summary: Kamp wijzigen
      description: '**Rollen:** `organisation_admin`, `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camp'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
      - Kampen
      summary: Kamp verwijderen
      description: 'Enkel mogelijk zolang het kamp niet gepubliceerd is.


        **Rollen:** `organisation_admin`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Verwijderd
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/camps/{campId}/publish:
    post:
      tags:
      - Kampen
      summary: Kamp publiceren
      description: 'Publiceert `camp.CampPublished.v1`.


        **Rollen:** `organisation_admin`, `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camp'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/camps/{campId}/status:
    put:
      tags:
      - Kampen
      summary: Status wijzigen
      description: 'Enkel de volgende stap in de levenscyclus is toegelaten. Bij `ended` volgt `camp.CampEnded.v1`.


        **Rollen:** `organisation_admin`, `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  $ref: '#/components/schemas/CampStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camp'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/camps/{campId}/groups:
    get:
      tags:
      - Groepen
      summary: Groepen van een kamp
      description: '**Rollen:** `guardian`, `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Groepen
      summary: Groep toevoegen
      description: 'Messaging maakt automatisch een groepschat aan.


        **Rollen:** `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
      responses:
        '201':
          description: Aangemaakt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/camps/{campId}/groups/{groupId}:
    put:
      tags:
      - Groepen
      summary: Groep wijzigen
      description: '**Rollen:** `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
      - Groepen
      summary: Groep verwijderen
      description: 'Enkel als er geen actieve deelnemers meer in zitten.


        **Rollen:** `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Verwijderd
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/camps/{campId}/participants:
    get:
      tags:
      - Deelnemers & leiding
      summary: Deelnemers opvragen
      description: '**Rollen:** `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: groupId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Deelnemers & leiding
      summary: Kind toevoegen aan een groep
      description: 'Controleert synchroon bij User of het kind bestaat en de ouder gemachtigd is. Publiceert `camp.ParticipantAdded.v1`.


        **Rollen:** `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - childUserId
              - groupId
              properties:
                childUserId:
                  type: string
                  format: uuid
                groupId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Toegevoegd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/camps/{campId}/participants/{participantId}:
    patch:
      tags:
      - Deelnemers & leiding
      summary: Kind naar een andere groep verplaatsen
      description: 'Chat- en belrechten schuiven automatisch mee.


        **Rollen:** `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: participantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - groupId
              properties:
                groupId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
      - Deelnemers & leiding
      summary: Kind uit het kamp halen
      description: 'Publiceert `camp.ParticipantRemoved.v1`.


        **Rollen:** `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: participantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Verwijderd
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/camps/{campId}/staff:
    get:
      tags:
      - Deelnemers & leiding
      summary: Leiding van een kamp
      description: '**Rollen:** `guardian`, `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAssignment'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Deelnemers & leiding
      summary: Leiding toewijzen
      description: 'Zonder `groupId` geldt de toewijzing voor het hele kamp. Publiceert `camp.StaffAssigned.v1`.


        **Rollen:** `organisation_admin`, `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - staffUserId
              - staffRole
              properties:
                staffUserId:
                  type: string
                  format: uuid
                groupId:
                  type: string
                  format: uuid
                staffRole:
                  $ref: '#/components/schemas/StaffRole'
      responses:
        '201':
          description: Toegewezen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAssignment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/camps/{campId}/staff/{staffAssignmentId}:
    delete:
      tags:
      - Deelnemers & leiding
      summary: Toewijzing intrekken
      description: '**Rollen:** `organisation_admin`, `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: staffAssignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Ingetrokken
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/camps/{campId}/activities:
    get:
      tags:
      - Activiteiten
      summary: Programma opvragen
      description: '**Rollen:** `guardian`, `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: groupId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Activiteiten
      summary: Activiteit toevoegen
      description: '**Rollen:** `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '201':
          description: Toegevoegd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/camps/{campId}/activities/{activityId}:
    put:
      tags:
      - Activiteiten
      summary: Activiteit wijzigen
      description: '**Rollen:** `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: activityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
      - Activiteiten
      summary: Activiteit verwijderen
      description: '**Rollen:** `staff`'
      parameters:
      - name: campId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: activityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Verwijderd
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token van de Identity Service. De gateway valideert het token, de service controleert
        tenant en rol.
  responses:
    ValidationError:
      description: Validatiefout
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Geen of ongeldig access token
    Forbidden:
      description: Geen toegang (verkeerde rol of andere organisatie)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Niet gevonden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict met de huidige toestand
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      description: Foutformaat volgens RFC 7807 (standaard in ASP.NET Core)
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Page:
      type: object
      required:
      - page
      - pageSize
      - totalCount
      properties:
        page:
          type: integer
          format: int32
          example: 1
        pageSize:
          type: integer
          format: int32
          example: 25
        totalCount:
          type: integer
          format: int32
          example: 3
    CampStatus:
      type: string
      enum:
      - planned
      - active
      - ended
      - archived
    StaffRole:
      type: string
      enum:
      - camp_leader
      - animator
    CampInput:
      type: object
      required:
      - name
      - startDate
      - endDate
      properties:
        name:
          type: string
          example: Zomerkamp 2027
        description:
          type: string
        location:
          type: string
          example: Kampplaats De Brand, Ronse
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        ageMin:
          type: integer
          format: int32
          example: 8
        ageMax:
          type: integer
          format: int32
          example: 12
    Camp:
      allOf:
      - type: object
        required:
        - campId
        - status
        - isPublished
        properties:
          campId:
            type: string
            format: uuid
          status:
            $ref: '#/components/schemas/CampStatus'
          isPublished:
            type: boolean
          publishedAt:
            type: string
            format: date-time
          createdAt:
            type: string
            format: date-time
      - $ref: '#/components/schemas/CampInput'
    GroupInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: Kabouters
        ageMin:
          type: integer
          format: int32
        ageMax:
          type: integer
          format: int32
    Group:
      allOf:
      - type: object
        properties:
          groupId:
            type: string
            format: uuid
          campId:
            type: string
            format: uuid
      - $ref: '#/components/schemas/GroupInput'
    Participant:
      type: object
      properties:
        participantId:
          type: string
          format: uuid
        childUserId:
          type: string
          format: uuid
        displayName:
          type: string
          description: Uit het read-model
        groupId:
          type: string
          format: uuid
        joinedAt:
          type: string
          format: date-time
        isActive:
          type: boolean
    StaffAssignment:
      type: object
      properties:
        staffAssignmentId:
          type: string
          format: uuid
        staffUserId:
          type: string
          format: uuid
        displayName:
          type: string
        groupId:
          type: string
          format: uuid
        staffRole:
          $ref: '#/components/schemas/StaffRole'
        assignedAt:
          type: string
          format: date-time
    ActivityInput:
      type: object
      required:
      - title
      - startsAt
      - endsAt
      properties:
        title:
