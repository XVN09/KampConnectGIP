openapi: 3.0.0
info:
  title: KampConnect — User Service
  version: 1.0.0
  description: "Wie iemand is binnen een organisatie: profielen, ouder-kindkoppelingen, noodcontacten en adressen.\n\
    Auth bezit de credentials, User bezit de persoon. Een kind is een profiel **zonder** login. Database: `usr_*`.\n\
    \n**Algemene afspraken**\n* Alle requests lopen via de API Gateway en dragen een `Authorization: Bearer <access\
    \ token>`.\n* De organisatie volgt uit de claim `tenant_id` in het token; ze staat daarom niet in de URL.\n\
    \  Een token zonder `tenant_id` krijgt geen toegang tot organisatiegegevens, tenzij `is_platform_admin` aanwezig\
    \ is.\n* Tijdstippen zijn UTC in ISO 8601. Fouten volgen RFC 7807 (Problem Details).\n"
servers:
- url: https://api.kampconnect.be
  description: Productie (via de API Gateway)
- url: https://localhost:5000
  description: Lokaal (gateway)
security:
- bearerAuth: []
tags:
- name: Profielen
  description: Profielgegevens
- name: Ouder-kindkoppelingen
  description: Relaties tussen ouders/voogden en kinderen
- name: Contacten & adressen
  description: Noodcontacten en adressen
paths:
  /api/users/me:
    get:
      tags:
      - Profielen
      summary: Mijn profiel
      description: '**Rollen:** `guardian`, `staff`'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
      - Profielen
      summary: Mijn profiel wijzigen
      description: 'Publiceert `user.UserProfileUpdated.v1`.


        **Rollen:** `guardian`, `staff`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users:
    get:
      tags:
      - Profielen
      summary: Profielen zoeken binnen de organisatie
      description: '**Rollen:** `staff`'
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Zoekt op naam
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/{userId}:
    get:
      tags:
      - Profielen
      summary: Profiel opvragen
      description: 'Een ouder ziet enkel zichzelf en de eigen kinderen.


        **Rollen:** `guardian`, `staff`'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
      - Profielen
      summary: Profiel wijzigen (bv. van een kind)
      description: '**Rollen:** `guardian`, `staff`'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/me/children:
    get:
      tags:
      - Ouder-kindkoppelingen
      summary: Mijn kinderen
      description: '**Rollen:** `guardian`'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Ouder-kindkoppelingen
      summary: Kind toevoegen
      description: 'Maakt een profiel zonder login aan en koppelt het meteen aan de ouder. Publiceert `user.UserProfileCreated.v1`
        en `user.GuardianLinked.v1`.


        **Rollen:** `guardian`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildCreate'
      responses:
        '201':
          description: Aangemaakt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/{userId}/guardians:
    get:
      tags:
      - Ouder-kindkoppelingen
      summary: Ouders/voogden van een kind
      description: '**Rollen:** `guardian`, `staff`'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuardianLink'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/guardian-links:
    post:
      tags:
      - Ouder-kindkoppelingen
      summary: Extra ouder/voogd koppelen
      description: 'Bv. de tweede ouder. Wordt actief na verificatie door de organisatie.


        **Rollen:** `guardian`, `staff`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardianLinkCreate'
      responses:
        '201':
          description: Aangemaakt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianLink'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/guardian-links/{guardianLinkId}/verify:
    post:
      tags:
      - Ouder-kindkoppelingen
      summary: Koppeling verifiëren
      description: 'Publiceert `user.GuardianLinked.v1`.


        **Rollen:** `staff`'
      parameters:
      - name: guardianLinkId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianLink'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/guardian-links/{guardianLinkId}:
    delete:
      tags:
      - Ouder-kindkoppelingen
      summary: Koppeling intrekken
      description: '**Rollen:** `guardian`, `staff`'
      parameters:
      - name: guardianLinkId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: Ingetrokken
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/{userId}/emergency-contacts:
    get:
      tags:
      - Contacten & adressen
      summary: Noodcontacten opvragen
      description: '**Rollen:** `guardian`, `staff`'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmergencyContact'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Contacten & adressen
      summary: Noodcontact toevoegen
      description: '**Rollen:** `guardian`'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyContactInput'
      responses:
        '201':
          description: Toegevoegd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyContact'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/emergency-contacts/{emergencyContactId}:
    put:
      tags:
      - Contacten & adressen
      summary: Noodcontact wijzigen
      description: '**Rollen:** `guardian`'
      parameters:
      - name: emergencyContactId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyContactInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyContact'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
      - Contacten & adressen
      summary: Noodcontact verwijderen
      description: '**Rollen:** `guardian`'
      parameters:
      - name: emergencyContactId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: Verwijderd
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/{userId}/addresses:
    get:
      tags:
      - Contacten & adressen
      summary: Adressen opvragen
      description: '**Rollen:** `guardian`, `staff`'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Contacten & adressen
      summary: Adres toevoegen
      description: '**Rollen:** `guardian`, `staff`'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Toegevoegd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/addresses/{addressId}:
    put:
      tags:
      - Contacten & adressen
      summary: Adres wijzigen
      description: '**Rollen:** `guardian`, `staff`'
      parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
      - Contacten & adressen
      summary: Adres verwijderen
      description: '**Rollen:** `guardian`, `staff`'
      parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '204':
          description: Verwijderd
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token van de Identity Service. De gateway valideert het token, de service controleert
        tenant en rol.
  responses:
    ValidationError:
      description: Validatiefout
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Geen of ongeldig access token
    Forbidden:
      description: Geen toegang (verkeerde rol of andere organisatie)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Niet gevonden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict met de huidige toestand
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      description: Foutformaat volgens RFC 7807 (standaard in ASP.NET Core)
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Page:
      type: object
      required:
      - page
      - pageSize
      - totalCount
      properties:
        page:
          type: integer
          format: int32
          example: 1
        pageSize:
          type: integer
          format: int32
          example: 25
        totalCount:
          type: integer
          format: int32
          example: 3
    User:
      type: object
      required:
      - userId
      - givenName
      - familyName
      - status
      properties:
        userId:
          type: integer
          format: int32
          example: 58
        givenName:
          type: string
          example: Lotte
        familyName:
          type: string
          example: Peeters
        birthDate:
          type: string
          format: date
        email:
          type: string
          format: email
        phone:
          type: string
        preferredLanguage:
          type: string
          example: nl
        avatarFileId:
          type: string
          format: uuid
          description: Bestand in de Media Service
        hasLogin:
          type: boolean
          description: false voor kinderen
        status:
          type: string
          enum:
          - active
          - inactive
          - anonymized
    UserUpdate:
      type: object
      properties:
        givenName:
          type: string
        familyName:
          type: string
        birthDate:
          type: string
          format: date
        phone:
          type: string
        preferredLanguage:
          type: string
        avatarFileId:
          type: string
          format: uuid
    ChildCreate:
      type: object
      required:
      - givenName
      - familyName
      - birthDate
      properties:
        givenName:
          type: string
        familyName:
          type: string
        birthDate:
          type: string
          format: date
        relationshipType:
          $ref: '#/components/schemas/RelationshipType'
    RelationshipType:
      type: string
      enum:
      - parent
      - legal_guardian
      - foster_parent
      - other
    GuardianLink:
      type: object
      properties:
        guardianLinkId:
          type: integer
          format: int32
        guardianUserId:
          type: integer
          format: int32
        childUserId:
          type: integer
          format: int32
        relationshipType:
          $ref: '#/components/schemas/RelationshipType'
        hasLegalAuthority:
          type: boolean
        status:
          type: string
          enum:
          - pending
          - active
          - revoked
        verifiedAt:
          type: string
          format: date-time
    GuardianLinkCreate:
      type: object
      required:
      - guardianEmail
      - childUserId
      - relationshipType
      properties:
        guardianEmail:
          type: string
          format: email
        childUserId:
          type: integer
          format: int32
        relationshipType:
          $ref: '#/components/schemas/RelationshipType'
        hasLegalAuthority:
          type: boolean
    EmergencyContactInput:
      type: object
      required:
      - fullName
      - phone
      - priority
      properties:
        fullName:
          type: string
        relationshipType:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        priority:
          type: integer
          format: int32
          minimum: 1
          example: 1
        authorizedForPickup:
          type: boolean
          description: Mag het kind ophalen
    EmergencyContact:
      allOf:
      - type: object
        properties:
          emergencyContactId:
            type: integer
            format: int32
      - $ref: '#/components/schemas/EmergencyContactInput'
    AddressInput:
      type: object
      required:
      - street
      - houseNumber
      - postalCode
      - city
      - countryCode
      properties:
        addressType:
          type: string
          enum:
          - home
          - billing
          - other
        street:
          type: string
        houseNumber:
          type: string
        box:
          type: string
        postalCode:
          type: string
          example: '2220'
        city:
          type: string
          example: Heist-op-den-Berg
        countryCode:
          type: string
          example: BE
        isPrimary:
          type: boolean
    Address:
      allOf:
      - type: object
        properties:
          addressId:
            type: integer
            format: int32
      - $ref: '#/components/schemas/AddressInput'
